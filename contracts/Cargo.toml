[workspace]
resolver = "2"
members = ["slime_nft", "items_mt", "town", "goo", "integration-tests"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/Buildonly/Slimeworld"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
